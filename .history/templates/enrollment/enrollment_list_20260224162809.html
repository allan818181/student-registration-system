{% extends 'base.html' %}

{% block title %}Enrollments - Student Registration System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="bi bi-clipboard-check"></i> Course Enrollments</h1>
</div>

<!-- Filters -->
<div class="card mb-4">
    <div class="card-body">
        <form method="get" class="row g-3">
            <div class="col-md-4">
                <select name="status" class="form-select">
                    <option value="">All Statuses</option>
                    <option value="PENDING" {% if status_filter == 'PENDING' %}selected{% endif %}>Pending</option>
                    <option value="APPROVED" {% if status_filter == 'APPROVED' %}selected{% endif %}>Approved</option>
                    <option value="DROPPED" {% if status_filter == 'DROPPED' %}selected{% endif %}>Dropped</option>
                    <option value="REJECTED" {% if status_filter == 'REJECTED' %}selected{% endif %}>Rejected</option>
                </select>
            </div>
            <div class="col-md-4">
                <select name="semester" class="form-select">
                    <option value="">All Semesters</option>
                    {% for sem in semesters %}
                    <option value="{{ sem.id }}">{{ sem }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-search"></i> Filter
                </button>
            </div>
            <div class="col-md-2">
                <a href="{% url 'enrollment:enrollment_list' %}" class="btn btn-outline-secondary w-100">
